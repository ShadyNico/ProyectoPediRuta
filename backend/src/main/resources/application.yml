server:
  port: 8080

spring:
  application:
    name: pediruta
  datasource:
    url: jdbc:postgresql://localhost:5432/pediruta
    username: pediruta
    password: pediruta
    hikari:
      # Si la base no responde, fallar rápido en lugar de colgarse (falacia: "la latencia es cero")
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

pediruta:
  gps:
    # Puerto del servidor de sockets TCP que recibe posiciones del simulador (tema 1.3)
    puerto: 9090
    # Si un dispositivo no envía nada en este tiempo, se cierra su conexión
    tiempo-espera-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ec.pediruta: DEBUG
